<!doctype html>
<!-- Shown by the Android app when the server's page can't be loaded.
     It is served from the APK, so it works offline. No build step. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HomeVentory</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #15171c;
      color: #e8e9ec;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main { max-width: 360px; padding: 24px; text-align: center; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #a3a7b0; margin: 0 0 24px; overflow-wrap: anywhere; }
    button {
      display: block;
      width: 100%;
      min-height: 44px;
      margin-top: 12px;
      border: 1px solid #3a3e48;
      border-radius: 8px;
      background: #252830;
      color: inherit;
      font: inherit;
      font-weight: 600;
    }
    button.primary { background: #c88a52; border-color: #c88a52; color: #15171c; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.svg" alt="" width="96" height="96">
    <h1>Can't reach your server</h1>
    <p id="detail">Check that the server is running and that this phone is on the same network.</p>
    <button class="primary" id="retry">Try again</button>
    <button id="change">Use a different server</button>
  </main>
  <script>
    var shell = window.Capacitor && window.Capacitor.Plugins.HomeVentoryShell;
    var server = null;
    if (shell) {
      shell.info().then(function (info) {
        server = info.server;
        if (server) {
          document.getElementById("detail").textContent =
            "Couldn't load " + server + ". Check that the server is running and that this phone is on the same network.";
        }
      });
    }
    document.getElementById("retry").onclick = function () {
      if (server) window.location.href = server;
      else window.history.back();
    };
    document.getElementById("change").onclick = function () {
      if (shell) shell.disconnect();
    };
  </script>
</body>
</html>
